<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhaleTracker Pro | Institutional Flow Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background-color: #090a0f; color: #e2e8f0; }
        .glow { text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        .card-glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6">

    <!-- Header -->
    <header class="w-full max-w-6xl flex justify-between items-center py-6 mb-8 border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
            <span class="text-xl font-extrabold tracking-wider text-white glow">WHALE<span class="text-sky-400">TRACKER</span>.IO</span>
        </div>
        <div class="flex items-center space-x-4 text-xs text-slate-400">
            <span class="px-3 py-1 bg-slate-900 border border-slate-800 rounded-full">🟢 Live Feed Active</span>
            <span class="px-3 py-1 bg-slate-900 border border-slate-800 rounded-full">Network: Ethereum Mainnet</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-6xl space-y-6">
        
        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="card-glass p-5 rounded-xl border-l-4 border-sky-500">
                <p class="text-xs text-slate-400 uppercase tracking-wider">Monitored Entities</p>
                <p class="text-2xl font-bold text-white mt-1">5 Institutional Wallets</p>
            </div>
            <div class="card-glass p-5 rounded-xl border-l-4 border-emerald-500">
                <p class="text-xs text-slate-400 uppercase tracking-wider">Tracking Threshold</p>
                <p class="text-2xl font-bold text-emerald-400 mt-1">> 20.00 ETH</p>
            </div>
            <div class="card-glass p-5 rounded-xl border-l-4 border-purple-500">
                <p class="text-xs text-slate-400 uppercase tracking-wider">Database Status</p>
                <p class="text-2xl font-bold text-purple-400 mt-1">Supabase Connected</p>
            </div>
        </div>

        <!-- Live Feed Table Card -->
        <div class="card-glass rounded-xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/40">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300">Live Whale Transactions</h2>
                <button onclick="fetchWhaleData()" class="text-xs bg-sky-500/10 text-sky-400 hover:bg-sky-500/20 border border-sky-500/30 px-3 py-1.5 rounded-lg transition">🔄 Refresh Feed</button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs text-slate-400 uppercase bg-slate-900/50">
                            <th class="p-4">Entity</th>
                            <th class="p-4">Amount</th>
                            <th class="p-4">From</th>
                            <th class="p-4">To</th>
                            <th class="p-4">Timestamp</th>
                            <th class="p-4 text-right">Explorer</th>
                        </tr>
                    </thead>
                    <tbody id="whale-table-body" class="divide-y divide-slate-800/60 text-sm">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-500">Loading live whale transactions from database...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Script to Fetch Supabase Data -->
    <script>
        const SUPABASE_URL = "https://wvjizynekngngsnxvebx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_GJuByFQY7fvX7LjC6TH_-g_VNVEP...";

        async function fetchWhaleData() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/whale_txs?select=*&order=created_at.desc&limit=25`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                const data = await response.json();
                
                const tbody = document.getElementById("whale-table-body");
                tbody.innerHTML = "";

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">No whale transactions logged yet. Waiting for market movement (>20 ETH)...</td></tr>`;
                    return;
                }

                data.forEach(tx => {
                    const dateStr = new Date(tx.created_at).toLocaleTimeString();
                    const row = document.createElement("tr");
                    row.className = "hover:bg-slate-800/30 transition";
                    row.innerHTML = `
                        <td class="p-4 font-semibold text-sky-400">${tx.wallet_name}</td>
                        <td class="p-4 font-bold text-emerald-400">⚡ ${Number(tx.eth_amount).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} ETH</td>
                        <td class="p-4 text-xs text-slate-400">${tx.tx_from.substring(0, 8)}...</td>
                        <td class="p-4 text-xs text-slate-400">${tx.tx_to.substring(0, 8)}...</td>
                        <td class="p-4 text-xs text-slate-500">${dateStr}</td>
                        <td class="p-4 text-right">
                            <a href="https://etherscan.io/tx/${tx.tx_hash}" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-sky-300 px-3 py-1 rounded border border-slate-700 transition">View ↗</a>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        // Fetch on load & auto-refresh every 15 seconds
        fetchWhaleData();
        setInterval(fetchWhaleData, 15000);
    </script>
</body>
</html>
