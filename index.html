<section id="suprim-terminal" style="max-width: 1100px; margin: 40px auto; padding: 24px; background: #0b0e14; border: 1px solid #1e2536; border-radius: 12px; font-family: 'Inter', -apple-system, sans-serif; color: #e2e8f0;">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px;">
    <div>
      <h2 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; color: #ffffff;">
        ⚡ SUPRIM LIVE INSTITUTIONAL FEED
      </h2>
      <p style="margin: 4px 0 0; font-size: 13px; color: #8b9bb4;">
        Real-time smart-money whale flows, unusual options sweeps &amp; SEC Form 4 insider buys
      </p>
    </div>

    <!-- Filter Buttons -->
    <div id="filter-bar" style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button onclick="setFilter('ALL', this)" class="filter-btn active" style="padding: 8px 14px; border-radius: 6px; border: 1px solid #2962ff; background: #2962ff; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;">All Signals</button>
      <button onclick="setFilter('CRYPTO WHALE', this)" class="filter-btn" style="padding: 8px 14px; border-radius: 6px; border: 1px solid #1e2536; background: #131824; color: #94a3b8; font-size: 12px; font-weight: 600; cursor: pointer;">🐋 Crypto Whales</button>
      <button onclick="setFilter('OPTIONS SWEEP', this)" class="filter-btn" style="padding: 8px 14px; border-radius: 6px; border: 1px solid #1e2536; background: #131824; color: #94a3b8; font-size: 12px; font-weight: 600; cursor: pointer;">🚨 Options Sweeps</button>
      <button onclick="setFilter('INSIDER BUY', this)" class="filter-btn" style="padding: 8px 14px; border-radius: 6px; border: 1px solid #1e2536; background: #131824; color: #94a3b8; font-size: 12px; font-weight: 600; cursor: pointer;">👔 Insider Buys</button>
    </div>
  </div>

  <!-- Alerts Table -->
  <div style="overflow-x: auto;">
    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
      <thead>
        <tr style="border-bottom: 1px solid #1e2536; color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em;">
          <th style="padding: 12px 10px;">Time</th>
          <th style="padding: 12px 10px;">Signal Type</th>
          <th style="padding: 12px 10px;">Asset</th>
          <th style="padding: 12px 10px;">Entity / Details</th>
          <th style="padding: 12px 10px; text-align: right;">Est. Value</th>
          <th style="padding: 12px 10px; text-align: right;">Proof</th>
        </tr>
      </thead>
      <tbody id="suprim-feed-body">
        <tr>
          <td colspan="6" style="padding: 24px; text-align: center; color: #64748b;">Connecting to SUPRIM live signal stream...</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<script>
  const SUPABASE_URL = "https://wvjizynekngngsnxvebx.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; // Replace with your public anon key
  let currentCategory = "ALL";

  function setFilter(category, btn) {
    currentCategory = category;
    document.querySelectorAll(".filter-btn").forEach(b => {
      b.style.background = "#131824";
      b.style.borderColor = "#1e2536";
      b.style.color = "#94a3b8";
    });
    btn.style.background = "#2962ff";
    btn.style.borderColor = "#2962ff";
    btn.style.color = "#ffffff";
    loadSuprimAlerts();
  }

  function getBadgeStyle(category) {
    if (category === "CRYPTO WHALE") return "background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3);";
    if (category === "OPTIONS SWEEP") return "background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3);";
    return "background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3);";
  }

  async function loadSuprimAlerts() {
    const tbody = document.getElementById("suprim-feed-body");
    let queryUrl = `${SUPABASE_URL}/rest/v1/suprim_alerts?select=*&order=created_at.desc&limit=25`;
    if (currentCategory !== "ALL") {
      queryUrl += `&category=eq.${encodeURIComponent(currentCategory)}`;
    }

    try {
      const response = await fetch(queryUrl, {
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
        }
      });
      const rows = await response.json();

      if (!rows || rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="padding: 24px; text-align: center; color: #64748b;">No signals recorded in this category yet. Monitoring live markets...</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(row => {
        const timeStr = new Date(row.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const usdFormatted = "$" + Number(row.usd_value).toLocaleString(undefined, { maximumFractionDigits: 0 });
        return `
          <tr style="border-bottom: 1px solid #151b28; transition: background 0.15s;" onmouseover="this.style.background='#131824'" onmouseout="this.style.background='transparent'">
            <td style="padding: 14px 10px; color: #64748b; white-space: nowrap;">${timeStr}</td>
            <td style="padding: 14px 10px; white-space: nowrap;">
              <span style="padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; ${getBadgeStyle(row.category)}">${row.category}</span>
            </td>
            <td style="padding: 14px 10px; font-weight: 700; color: #ffffff;">${row.asset}</td>
            <td style="padding: 14px 10px;">
              <div style="font-weight: 600; color: #e2e8f0;">${row.headline}</div>
              <div style="font-size: 12px; color: #64748b; margin-top: 2px;">${row.details || ""}</div>
            </td>
            <td style="padding: 14px 10px; text-align: right; font-weight: 700; color: #34d399; white-space: nowrap;">${usdFormatted}</td>
            <td style="padding: 14px 10px; text-align: right; white-space: nowrap;">
              ${row.source_url ? `<a href="${row.source_url}" target="_blank" style="color: #60a5fa; text-decoration: none; font-weight: 600;">Verify ↗</a>` : "-"}
            </td>
          </tr>
        `;
      }).join("");
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding: 24px; text-align: center; color: #ef4444;">Error loading feed. Check Supabase anon key.</td></tr>`;
    }
  }

  loadSuprimAlerts();
  setInterval(loadSuprimAlerts, 30000);
</script>
