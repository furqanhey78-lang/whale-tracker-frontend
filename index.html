<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUPRIM — Institutional Whale, Options & Insider Alert Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #07090e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }

    /* Top Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px;
      border-bottom: 1px solid #161d2d;
      background: rgba(11, 14, 20, 0.9);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
    }
    .live-dot {
      width: 9px;
      height: 9px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }
    .nav-actions { display: flex; gap: 12px; align-items: center; }
    .btn-ghost {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #1e2536;
      background: #111622;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-ghost:hover { border-color: #3b82f6; color: #fff; }
    .btn-primary {
      padding: 9px 18px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #2962ff, #1d4ed8);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(41, 98, 255, 0.35);
    }
    .btn-primary:hover { opacity: 0.92; }

    /* Hero Section */
    .hero {
      max-width: 1100px;
      margin: 44px auto 28px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
    }
    .hero h1 {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .hero p {
      color: #8b9bb4;
      font-size: 15px;
      margin-top: 6px;
      max-width: 620px;
    }

    /* Terminal Container */
    .terminal-card {
      max-width: 1100px;
      margin: 0 auto 60px;
      padding: 24px;
      background: #0b0e14;
      border: 1px solid #1e2536;
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 14px;
      border-radius: 7px;
      border: 1px solid #1e2536;
      background: #131824;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: #334155; color: #fff; }
    .filter-btn.active {
      background: #2962ff;
      border-color: #2962ff;
      color: #ffffff;
    }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th {
      padding: 12px 10px;
      border-bottom: 1px solid #1e2536;
      color: #64748b;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    td { padding: 14px 10px; border-bottom: 1px solid #141a26; }
    tr:hover td { background: #111623; }

    .modal-backdrop {

      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
